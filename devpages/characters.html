<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot Isles · Characters Dev</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0a1720;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 5;
        width: min(420px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 12px 14px;
        border: 1px solid rgb(232 200 138 / 34%);
        border-radius: 12px;
        color: #f4fbff;
        background: rgb(8 21 30 / 76%);
        backdrop-filter: blur(14px);
        font-size: 12px;
      }
      #hud strong {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
      }
      #hud button {
        min-height: 32px;
        margin: 2px;
        border: 0;
        border-radius: 999px;
        padding: 5px 10px;
        color: #09202d;
        background: #d8eff9;
        cursor: pointer;
        font-size: 11px;
      }
      #hud button.primary {
        background: #e8c88a;
      }
      #hud label {
        display: grid;
        grid-template-columns: 58px 1fr 34px;
        gap: 6px;
        align-items: center;
        margin: 6px 0;
      }
      #stats {
        margin-top: 8px;
        color: #b9d8e5;
        font:
          11px/1.4 ui-monospace,
          Menlo,
          monospace;
        white-space: pre-wrap;
      }
      body.shot #hud {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="hud">
      <strong>Characters · Test Cove</strong>
      <div id="clips"></div>
      <label
        >Speed <input id="speed" type="range" min="0" max="4.2" step="0.05" value="0" /><span id="speedV"
          >0</span
        ></label
      >
      <div>
        <button data-view="lineup" class="primary">Lineup</button>
        <button data-view="close">Close</button>
        <button data-view="village">Village</button>
        <button data-view="webgl">WebGL URL</button>
      </div>
      <div id="stats">Loading…</div>
    </div>
    <script type="module" src="/src/dev/characters.ts"></script>
  </body>
</html>
