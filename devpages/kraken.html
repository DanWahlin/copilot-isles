<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot Isles · Kraken Dev</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #081722;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        left: 16px;
        top: 16px;
        width: 300px;
        padding: 12px 14px;
        border-radius: 12px;
        color: white;
        background: rgb(7 20 30 / 72%);
        font:
          12px/1.4 ui-monospace,
          Menlo,
          monospace;
      }
      #panel .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      #panel button {
        min-width: 44px;
        min-height: 44px;
        padding: 0 10px;
        border: 1px solid rgb(255 255 255 / 25%);
        border-radius: 8px;
        color: white;
        background: rgb(255 255 255 / 10%);
        font: inherit;
        cursor: pointer;
      }
      #panel button[aria-pressed='true'] {
        background: rgb(219 113 163 / 55%);
      }
      #hud {
        white-space: pre;
      }
      body.shot #panel {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="panel">
      <div id="hud">Loading the kraken…</div>
      <div class="row">
        <button id="play" title="Play or pause (Space)">Pause</button>
        <button id="step" title="Step one frame (.)">Step</button>
        <button id="restart" title="Restart (R)">Restart</button>
        <button id="rm" aria-pressed="false" title="Reduced motion (M)">Reduced motion</button>
      </div>
      <div class="row">
        <button data-tier="lite" title="Lite (1)">Lite</button>
        <button data-tier="medium" title="Medium (2)">Medium</button>
        <button data-tier="high" title="High (3)">High</button>
        <button id="backend" title="WebGPU or WebGL2 (B)">WebGL2</button>
      </div>
      <div class="row">
        <button data-scenario="wreck" title="Wrap and break a raider at rest (W)">Wreck</button>
        <button data-scenario="fight" title="Flagship wrap during a moving fight (F)">Flagship fight</button>
        <button data-scenario="dodge" title="Hazard dodge: tell, strike, near miss (D)">Hazard dodge</button>
      </div>
      <div class="row">
        <button data-scenario="surface" title="It surfaces, arms round it (U)">Surface</button>
        <button data-scenario="sightings" title="Distant sightings (S)">Sightings</button>
        <button id="sight" title="A sighting now (K)">Sighting now</button>
      </div>
    </div>
    <script type="module" src="/src/dev/kraken.ts"></script>
  </body>
</html>
