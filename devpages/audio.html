<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kraken Isles Audio Dev Page</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #07131d;
        color: #f4ead2;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 10%, rgba(63, 208, 201, 0.24), transparent 28rem),
          linear-gradient(145deg, #081926, #0d2230 48%, #13251f);
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 32px;
      }
      h1,
      h2 {
        font-family: Georgia, serif;
        font-weight: 400;
      }
      section {
        margin: 18px 0;
        padding: 18px;
        border: 1px solid rgba(232, 200, 138, 0.32);
        border-radius: 14px;
        background: rgba(8, 15, 22, 0.55);
      }
      button,
      input[type='range'] {
        margin: 6px;
      }
      button {
        min-height: 44px;
        border: 1px solid rgba(232, 200, 138, 0.5);
        border-radius: 999px;
        background: rgba(232, 200, 138, 0.1);
        color: #f4ead2;
        padding: 0 16px;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #e8c88a;
        color: #07131d;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }
      #subtitle {
        min-height: 72px;
        padding: 16px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.42);
        font-size: 1.25rem;
        line-height: 1.65;
      }
      #subtitle .active {
        color: #3fd0c9;
        text-decoration: underline;
      }
      label {
        display: block;
        margin: 8px 0;
      }
      small {
        color: #b9c7cb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kraken Isles Audio Dev Page</h1>
      <p><small>Unlock audio first, then try the music tracks, SFX, beds, and voice subtitles.</small></p>
      <section>
        <button id="unlock">Unlock audio</button>
        <span id="status">Locked</span>
      </section>
      <section>
        <h2>Volumes</h2>
        <div id="volumes" class="grid"></div>
      </section>
      <section>
        <h2>Music</h2>
        <div id="tracks"></div>
      </section>
      <section>
        <h2>Soundscape</h2>
        <div id="soundscape"></div>
        <label>Day ↔ Night <input id="dayNight" type="range" min="0" max="1" value="0" step="0.01" /></label>
      </section>
      <section>
        <h2>Voice + subtitles</h2>
        <div id="voices"></div>
        <p id="subtitle" aria-live="polite">Load a voice line to see word highlighting.</p>
      </section>
    </main>
    <script type="module" src="/src/dev/audio.ts"></script>
  </body>
</html>
