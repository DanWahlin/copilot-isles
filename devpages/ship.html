<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copilot Isles · Brigantine Dev</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07131d;
        color: #f4dfb4;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      #gl {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #hud {
        position: fixed;
        left: 16px;
        top: 16px;
        max-width: 27rem;
        padding: 12px 14px;
        border: 1px solid rgb(255 228 176 / 0.25);
        border-radius: 12px;
        background: rgb(4 12 20 / 0.62);
        backdrop-filter: blur(10px);
        box-shadow: 0 16px 32px rgb(0 0 0 / 0.28);
        font-size: 13px;
        line-height: 1.45;
        pointer-events: none;
      }
      #hud b {
        color: #fff5ce;
      }
      #hud kbd {
        padding: 1px 5px;
        border: 1px solid rgb(255 255 255 / 0.22);
        border-bottom-width: 2px;
        border-radius: 4px;
        background: rgb(255 255 255 / 0.08);
        font-size: 12px;
      }
      #stats {
        margin-top: 0.35rem;
        font-variant-numeric: tabular-nums;
        color: #d8e7ff;
      }
    </style>
  </head>
  <body>
    <canvas id="gl" tabindex="0" aria-label="Brigantine sailing dynamics dev page"></canvas>
    <div id="hud">
      <b>Brigantine dev sail</b><br />
      <kbd>W</kbd>/<kbd>S</kbd> trim sails · <kbd>A</kbd>/<kbd>D</kbd> rudder · <kbd>P</kbd> sail the buoys ·
      <kbd>1</kbd>-<kbd>4</kbd> cameras · add <code>?webgl</code> for the WebGL2 backend
      <div id="stats"></div>
    </div>
    <script type="module" src="/src/dev/ship.ts"></script>
  </body>
</html>
