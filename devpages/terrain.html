<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kraken Isles Terrain Dev</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0a1720;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 5;
        padding: 12px 14px;
        border-radius: 12px;
        color: #f4fbff;
        background: rgb(8 21 30 / 72%);
        backdrop-filter: blur(14px);
        font-size: 12px;
      }
      #hud strong {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
      }
      #hud button {
        margin: 2px;
        border: 0;
        border-radius: 999px;
        padding: 6px 10px;
        color: #09202d;
        background: #d8eff9;
        cursor: pointer;
      }
      #stats {
        margin-top: 8px;
        color: #b9d8e5;
        font:
          11px/1.4 ui-monospace,
          Menlo,
          monospace;
        white-space: pre;
      }
      body.shot #hud {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="hud">
      <strong>Terrain packs</strong>
      <div id="views"></div>
      <div id="stats">Loading…</div>
    </div>
    <script type="module" src="/src/dev/terrain.ts"></script>
  </body>
</html>
