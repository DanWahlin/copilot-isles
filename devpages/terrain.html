<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copilot Isles Terrain Dev</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body,
      #terrain-root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0a1720;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 5;
        padding: 12px 14px;
        border-radius: 12px;
        color: #f4fbff;
        background: rgb(8 21 30 / 72%);
        box-shadow: 0 12px 32px rgb(0 0 0 / 28%);
        backdrop-filter: blur(14px);
      }
      #hud strong {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      #hud button {
        margin: 2px;
        border: 0;
        border-radius: 999px;
        padding: 6px 10px;
        color: #09202d;
        background: #d8eff9;
        cursor: pointer;
      }
      #stats {
        margin-top: 8px;
        color: #b9d8e5;
        font:
          12px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #e8f7ff;
        background: #09141d;
        transition: opacity 0.35s ease;
        z-index: 10;
      }
      body.ready #loading {
        pointer-events: none;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="terrain-root"></div>
    <div id="hud">
      <strong>Terrain views</strong>
      <button data-view="harbor">Harbor</button>
      <button data-view="headland">Headland cliffs</button>
      <button data-view="lagoon">Lagoon beach</button>
      <button data-view="stack">Sea stack</button>
      <div id="stats">Loading…</div>
    </div>
    <div id="loading">Baking light into limestone…</div>
    <script type="module" src="/src/dev/terrain.ts"></script>
  </body>
</html>
