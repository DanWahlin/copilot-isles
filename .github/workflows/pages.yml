name: Deploy to GitHub Pages

# Manual only. The deploy gate (PLAN §0 / spec §9) passed on 2026-10-15: the affiliation line is
# "an unofficial, personal project" (title screen, Credits, README), and the AI-voice disclosure
# required by the Azure AI Speech / Microsoft AI code of conduct is on the title screen, in Settings
# and in Credits. Pages on a private repo needs a paid GitHub plan; the site is public either way.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:budgets
      - run: npm run check:secrets
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
