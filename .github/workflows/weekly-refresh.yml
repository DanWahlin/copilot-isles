# PLAN §8.4: keeps everything the course feeds into the game up to date.
#
# Every course pack with a GitHub source (docs/specs/COURSE-PACKS.md §7), one job each: the `packs` job
# lists them (tools/course-pack/list.mjs --github), and each refresh job's COURSE is one of them. Every
# path is courses/$COURSE/, and each pack gets its own PR.
#
#   1 Course check   compare upstream main with the pack's lock.json (no dependencies needed)
#   2 Content        tools/course/sync.mjs: READMEs, the appendices the pack names, GLOSSARY.md, LICENSE,
#                    sections, and hashes
#   3 Screenshots    the same run copies referenced images byte-for-byte (pinned ones are kept) and
#                    saves upstream copies of changed pinned images for before/after montages
#   4 Drift report   tools/course/drift.ts, including the UI-term check
#  4b Content data   npm run content:check (tools/content/report.ts, docs/content-data.md): every
#                    file of the pack against its schema in courses/schemas/, the Model Market's course quotes still word for
#                    word in the new snapshot, every cited anchor still in the lock, Gilda's captions
#                    still her voice lines, and each course notice board's topics with what the sync
#                    added or removed. It lists each JSON entry that needs an edit.
#   5 Drafted fixes  not yet (follow-up: hand the drift report to the Copilot coding agent)
#   6 Voices         only when voice lines changed AND the Azure Speech secrets exist; safe to skip.
#                    A text-only course ("voice": false) just rewrites its captions (no secrets)
#   7 Other sources  not yet (follow-up: tools/music/fetch.sh --check and the ASSETS.md list)
#  7b Node.js LTS    a job of its own, every week whether or not a course changed: tools/course/node-lts.ts
#                    reads nodejs.org's release index, and fails when a checklist check that `tracks` the
#                    LTS (the gear rack's `node -v`) or a line that names the LTS no longer matches it.
#                    Then it opens an issue with the list (or comments on the open one).
#   8 Verify         typecheck, lint, unit tests (every SourceRef resolves against the snapshot),
#                    build, budgets, secret scan, and the Playwright suite
#   9 Deliver        one PR per pack, "Weekly refresh: <course> @ <sha>", labelled needs-content-review when
#                    authored content is affected, a content entry broke, or a check fails. Nothing
#                    auto-merges. Merging it deploys the site: the merge's push runs CI, and pages.yml
#                    deploys when CI passes on main.
#
# Uses only GITHUB_TOKEN. Opening the PR needs the repository setting "Allow GitHub Actions to create
# and approve pull requests". PRs opened with GITHUB_TOKEN don't start other workflows (CI), which is
# why step 8 runs the checks here.
name: Weekly refresh

on:
  schedule:
    - cron: '0 13 * * 1' # Mondays, 6 AM Pacific (PDT)
  workflow_dispatch:
    inputs:
      force:
        description: Refresh even if the course commit hasn't changed
        type: boolean
        default: false

permissions: {}

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  node-lts:
    name: Node.js LTS · the samples that follow it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # open the issue, and create its label the first time
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check
        id: lts
        run: npm run course:node-lts -- --out="$RUNNER_TEMP/node-lts.md"
      - name: Open or update the issue
        if: failure() && steps.lts.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/node-lts.md"
          if [ ! -s "$body" ]; then
            echo "The check failed before it wrote a report (nodejs.org or the course's repository didn't answer); see the log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          title="Node.js LTS changed: update the gear rack's node -v sample"
          gh label create needs-content-review --color D93F0B \
            --description 'The course changed under authored content (PLAN §8.4)' 2> /dev/null || true
          number=$(gh issue list --state open --label needs-content-review --json number,title \
            -q ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body" --label needs-content-review
          fi

  packs:
    name: Course packs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      courses: ${{ steps.list.outputs.courses }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: node tools/course-pack/list.mjs --github

  refresh:
    name: ${{ matrix.course }} · check, refresh, verify, and deliver
    needs: packs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # One pack at a time: each job runs the whole repository's checks.
      max-parallel: 1
      matrix:
        course: ${{ fromJSON(needs.packs.outputs.courses) }}
    permissions:
      contents: write # push the refresh branch
      pull-requests: write # open or update the PR
      issues: write # create the needs-content-review label the first time
    env:
      # The course pack this job follows (courses/<id>/course.json → source.repo).
      COURSE: ${{ matrix.course }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 1 · Course check
        id: check
        run: node tools/course/sync.mjs --course="$COURSE" --check

      - name: Refresh?
        id: go
        run: |
          if [ "${{ steps.check.outputs.changed }}" = "true" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "SHA=${{ steps.check.outputs.sha }}" >> "$GITHUB_ENV"
          else
            echo "courses/$COURSE is up to date with its course; nothing to refresh." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.go.outputs.run == 'true'
        run: npm ci
      - if: steps.go.outputs.run == 'true'
        run: echo "DRIFT_DIR=$RUNNER_TEMP/course-drift" >> "$GITHUB_ENV"

      - name: 2-3 · Content and screenshots
        if: steps.go.outputs.run == 'true'
        run: |
          mkdir -p "$DRIFT_DIR"
          git show "HEAD:courses/$COURSE/lock.json" > "$DRIFT_DIR/previous-lock.json" || echo '{}' > "$DRIFT_DIR/previous-lock.json"
          node tools/course/sync.mjs --course="$COURSE" --ref="$SHA" --report="$DRIFT_DIR"

      - name: 4 · Drift report
        if: steps.go.outputs.run == 'true'
        id: drift
        run: npx tsx tools/course/drift.ts --course="$COURSE" --previous="$DRIFT_DIR/previous-lock.json" --report="$DRIFT_DIR" --out="$DRIFT_DIR/report.md"

      - name: 4b · Content data (quotes, anchors, voice lines, board topics)
        if: steps.go.outputs.run == 'true'
        id: content
        continue-on-error: true # an unset "broken" output labels the PR, so it still opens
        run: npm run content:check -- --course="$COURSE" --previous="$DRIFT_DIR/previous-lock.json" --out="$DRIFT_DIR/content.md" --report-only

      - name: 6 · Voices (only changed lines, only with secrets)
        if: steps.go.outputs.run == 'true'
        id: voices
        continue-on-error: true
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          # Step 5 (drafted fixes) doesn't exist yet, so voice lines only change when a person edits
          # them on this branch. ElevenLabs lines need the ElevenLabs CLI sign-in and stay manual.
          # A text-only course has captions, not voices: write them again if a line changed (no secrets).
          if [ "$(node -p "require('./courses/$COURSE/course.json').voice !== false")" = "false" ]; then
            if npx tsx tools/voice/generate.ts --course "$COURSE" --check; then
              echo "summary=Text-only course: the captions match their lines." >> "$GITHUB_OUTPUT"
            else
              npx tsx tools/voice/generate.ts --course "$COURSE"
              echo "summary=Text-only course: captions rewritten for changed lines (no speech service)." >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # Lines whose text, voice or cast changed, from the manifest's cache keys (Azure only).
          changed=$(npx tsx tools/voice/generate.ts --course "$COURSE" --check --list-stale)
          if [ -z "$changed" ]; then
            echo "No Azure voice lines changed; nothing to regenerate." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "summary=No voice lines changed, so no TTS characters were used." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$AZURE_SPEECH_KEY" ] || [ -z "$AZURE_SPEECH_REGION" ]; then
            echo "Voice lines changed ($changed) but the Azure Speech secrets aren't set; skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "summary=Voice lines changed ($changed) but weren't regenerated: the Azure Speech secrets aren't set." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # tools/voice/generate.ts reads ~/.env; write it on the runner only, readable by this user only.
          umask 077
          printf 'AZURE_SPEECH_KEY=%s\nAZURE_SPEECH_REGION=%s\n' "$AZURE_SPEECH_KEY" "$AZURE_SPEECH_REGION" > "$HOME/.env"
          npx tsx tools/voice/generate.ts --course "$COURSE" --only="$changed"
          rm -f "$HOME/.env"
          echo "summary=Regenerated voice lines: $changed." >> "$GITHUB_OUTPUT"

      - name: 8 · Verify
        if: steps.go.outputs.run == 'true'
        id: verify
        env:
          CI: 'true'
        run: |
          set +e
          failed=""
          run() {
            local name=$1
            shift
            echo "::group::$name"
            "$@" || failed="$failed $name"
            echo "::endgroup::"
          }
          run typecheck npm run typecheck
          run lint npm run lint
          run format npm run format:check
          run unit-tests npm test
          run build npm run build
          run budgets npm run check:budgets
          run secrets npm run check:secrets
          npx playwright install --with-deps chromium > /dev/null
          run e2e npm run test:e2e
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          [ -z "$failed" ] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: actions/upload-artifact@v7
        if: always() && steps.go.outputs.run == 'true'
        with:
          name: course-drift-${{ matrix.course }}
          path: ${{ runner.temp }}/course-drift
          retention-days: 30

      - name: 9 · Deliver
        if: steps.go.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AFFECTED: ${{ steps.drift.outputs.affected }}
          CONTENT_BROKEN: ${{ steps.content.outputs.broken }}
          VERIFY_OK: ${{ steps.verify.outputs.ok }}
          VERIFY_FAILED: ${{ steps.verify.outputs.failed }}
          VOICES: ${{ steps.voices.outputs.summary }}
        run: |
          if [ -z "$(git status --porcelain -- "courses/$COURSE")" ]; then
            echo "The snapshot is already up to date; no PR." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          short=${SHA:0:7}
          branch="course-refresh/$COURSE/$short"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add "courses/$COURSE"
          git commit -m "Weekly refresh: $COURSE @ $short"
          git push --force origin "$branch"

          {
            repo=$(node -p "require('./courses/$COURSE/course.json').source.repo")
            echo "Refreshes the \`$COURSE\` course pack's snapshot to [\`$short\`](https://github.com/$repo/commit/$SHA) (PLAN §8.4)."
            echo
            echo '```'
            git diff --stat HEAD~1 HEAD
            echo '```'
            echo
            cat "$DRIFT_DIR/report.md"
            echo
            if [ -f "$DRIFT_DIR/content.md" ]; then cat "$DRIFT_DIR/content.md"; else echo "**The content data check didn't run.** See the workflow run."; fi
            echo
            echo "### Voices"
            echo
            echo "${VOICES:-Step 6 did not run.}"
            echo
            echo "### Checks"
            echo
            if [ "$VERIFY_OK" = "true" ]; then echo "Typecheck, lint, format, unit tests, build, budgets, secret scan, and e2e all passed."; else echo "**Failed:** ${VERIFY_FAILED:-unknown}. See the workflow run."; fi
            echo
            echo "Before/after montages of changed screenshots: the \`course-drift-$COURSE\` artifact of [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "_Not automated yet: step 5 (drafted fixes by the coding agent) and step 7 (music and asset sources)._"
          } > "$RUNNER_TEMP/pr-body.md"

          labels=()
          if [ "$AFFECTED" = "true" ] || [ "$CONTENT_BROKEN" != "false" ] || [ "$VERIFY_OK" != "true" ]; then
            gh label create needs-content-review --color D93F0B \
              --description 'The course changed under authored content (PLAN §8.4)' 2> /dev/null || true
            labels=(--label needs-content-review)
          fi
          course_title=$(node -p "require('./courses/$COURSE/course.json').title")
          title="Weekly refresh: $course_title @ $short"
          if gh pr view "$branch" --json state -q .state 2> /dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md" "${labels[@]/--label/--add-label}"
          else
            gh pr create --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md" "${labels[@]}"
          fi
